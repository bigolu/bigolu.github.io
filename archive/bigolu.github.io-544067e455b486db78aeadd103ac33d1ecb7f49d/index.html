<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <meta name="description" content="This is Biggie's personal site." />
    <meta
      name="keywords"
      content="olaolu,biggie,emmanuel,bigolu,bigolu96,personal,site,code"
    />
    <meta name="author" content="Olaolu Emmanuel Biggie" />

    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <link
      href="https://fonts.googleapis.com/css?family=Lato"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/materialize/0.100.2/css/materialize.min.css"
    />
    <link rel="stylesheet" href="index.css" />

    <title>Biggie</title>
  </head>

  <body>
    <div class="row" id="page-container">
      <script id="page-template" type="text/x-handlebars-template">
        <!-- github ribbon -->
        <a href="https://github.com/bigolu/bigolu.github.io"><img style="position: absolute; top: 0; left: 0; border: 0;" src="https://camo.githubusercontent.com/567c3a48d796e2fc06ea80409cc9dd82bf714434/68747470733a2f2f73332e616d617a6f6e6177732e636f6d2f6769746875622f726962626f6e732f666f726b6d655f6c6566745f6461726b626c75655f3132313632312e706e67" alt="Fork me on GitHub" data-canonical-src="https://s3.amazonaws.com/github/ribbons/forkme_left_darkblue_121621.png"></a>

        <!-- profile -->
        <div class="col s12 m3 l2 valign-wrapper" id="profile">
            <div class="section center">
                <img id="my-face" src="{{profile.image}}" class="circle responsive-img">

                <h5>{{profile.name}}</h5><br><br>

                <a id="email" href="#">{{profile.email}}</a><br>
                {{#each profile.links}}
                    <a href="{{href}}">{{text}}</a><br>
                {{/each}}
                <a href="resume.pdf">resume</a>
            </div>
        </div>

        <!-- divider line -->
        <div class="col s12 m1 l1 valign-wrapper" id="profile-portfolio-divider-container">
            <hr id="profile-portfolio-divider">
        </div>

        <!-- portfolio -->
        <div class="col s12 m8 l9" id="portfolio">
            {{#each works.categories}}
                <div class="section category-name">
                    <h2>{{name}}</h2>
                </div>

                <div class="section center works">
                    <div class="row center">
                        {{#each items}}
                            <div class="card col s8 offset-s2 m8 offset-m2 l4 offset-l1">
                              <div class="card-image">
                                <img src="{{image}}">
                              </div>
                              <div class="card-stacked">
                                <div class="card-content valign-wrapper">
                                    <p>
                                    <span class="title">{{title}}: </span>
                                    {{description}}
                                    {{#each links}}
                                        <a href="{{href}}">{{text}}</a>&nbsp;
                                    {{/each}}
                                </div>
                                    </p>
                              </div>
                            </div>
                        {{/each}}
                    </div>
                </div>
            {{/each}}
      </script>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/handlebars.js/4.0.10/handlebars.min.js"></script>
    <script type="text/javascript" src="js/page-data.js"></script>
    <script type="text/javascript" src="js/index.js"></script>

    <!-- google analytics -->
    <script>
      (function (i, s, o, g, r, a, m) {
        i["GoogleAnalyticsObject"] = r;
        (i[r] =
          i[r] ||
          function () {
            (i[r].q = i[r].q || []).push(arguments);
          }),
          (i[r].l = 1 * new Date());
        (a = s.createElement(o)), (m = s.getElementsByTagName(o)[0]);
        a.async = 1;
        a.src = g;
        m.parentNode.insertBefore(a, m);
      })(
        window,
        document,
        "script",
        "https://www.google-analytics.com/analytics.js",
        "ga"
      );

      ga("create", "UA-106445658-1", "auto");
      ga("send", "pageview");
    </script>
  </body>
</html>
